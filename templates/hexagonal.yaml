          import {{packagePath}}.models.ModelExample
          import {{packagePath}}.ports.outbound.ExampleRepositoryPort
          import {{packagePath}}.ports.inbound.ExampleUseCase
          
          class ExampleUseCaseImpl(
            private val exampleRepository: ExampleRepositoryPort
          ) : ExampleUseCase {
          
            override fun findById(id: Int): ModelExample?{
