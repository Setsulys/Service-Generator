# Configuration globale par défaut
config:
  springBoot-version: 4.0.0
  springBootStarterParent-version: 4.1.1
  java-version: 25
  kotlin-version: 2.4.20
  junit-version: 6.0.3
  mockk-version: 1.14.11
  springdoc-version: 3.1.1
  jdbc-version: 4.1.1
  liquibase-version: 4.1.1
  webmvc-ui-version: 3.1.1

  baseGroupId: com.example

# Definition propre templates
Project:
  paths:
  - path: "pom.xml"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <project xmlns="http://apache.org"
               xmlns:xsi="http://w3.org"
               xsi:schemaLocation="http://apache.org http://apache.org">
          <modelVersion>{{springBoot-version}}</modelVersion>

          <parent>
              <groupId>org.springframework.boot</groupId>
              <artifactId>spring-boot-starter-parent</artifactId>
              <version>{{springBootStarterParent-version}}</version>
              <relativePath/>
          </parent>

          <groupId>{{basePackage}}</groupId>
          <artifactId>{{projectName}}</artifactId>
          <version>0.0.1-SNAPSHOT</version>
          <packaging>pom</packaging>
          <name>{{projectName}}</name>
          <description>{{projectName}} Parent Project</description>

          <modules>
              <module>domain</module>
              <module>infrastructure</module>
          </modules>

          <properties>
              <java.version>{{java-version}}</java.version>
              <kotlin.version>{{kotlin-version}}</kotlin.version>
              <junit.version>{{junit-version}}</junit.version>
              <mockk.version>{{mockk-version}}</mockk.version>
          </properties>

          <dependencies>
              <!-- Test -->
              
              <dependency>
                  <groupId>org.junit.jupiter</groupId>
                  <artifactId>junit-jupiter-engine</artifactId>
                  <version>${junit.version}</version>
                  <scope>test</scope>
              </dependency>
          </dependencies>

          <dependencyManagement>
              <dependencies>
                  
                  <dependency>
                      <groupId>io.mockk</groupId>
                      <artifactId>mockk-jvm</artifactId>
                      <version>${mockk.version}</version>
                      <scope>test</scope>
                  </dependency>
                  <dependency>
                    <groupId>org.jetbrains.kotlin</groupId>
                    <artifactId>kotlin-stdlib</artifactId>
                    <version>${kotlin.version}</version>
                  </dependency>
                  <dependency>
                    <groupId>org.jetbrains.kotlin</groupId>
                    <artifactId>kotlin-reflect</artifactId>
                    <version>${kotlin.version}</version>
                  </dependency>
              </dependencies>
          </dependencyManagement>

          <build>
              <pluginManagement>
                  <plugins>
                      <plugin>
                          <groupId>org.jetbrains.kotlin</groupId>
                          <artifactId>kotlin-maven-plugin</artifactId>
                          <version>${kotlin.version}</version>
                          <executions>
                              <execution>
                                  <id>compile</id>
                                  <phase>compile</phase>
                                  <goals>
                                      <goal>compile</goal>
                                  </goals>
                              </execution>
                              <execution>
                                  <id>test-compile</id>
                                  <phase>test-compile</phase>
                                  <goals>
                                      <goal>test-compile</goal>
                                  </goals>
                              </execution>
                          </executions>
                          <configuration>
                              <args>
                                  <arg>-Xjsr305=strict</arg>
                              </args>
                              <compilerPlugins>
                                  <plugin>spring</plugin>
                              </compilerPlugins>
                              <jvmTarget>${java.version}</jvmTarget>
                          </configuration>
                          <dependencies>
                              <dependency>
                                  <groupId>org.jetbrains.kotlin</groupId>
                                  <artifactId>kotlin-maven-allopen</artifactId>
                                  <version>${kotlin.version}</version>
                              </dependency>
                          </dependencies>
                      </plugin>
                  </plugins>
              </pluginManagement>
          </build>
      </project>

  - path: ".gitignore"
    content: |
      target/
      !.mvn/wrapper/maven-wrapper.jar
      .mvn/wrapper/maven-wrapper.properties
      .idea/
      *.iml
      .DS_Store

