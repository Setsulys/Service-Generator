      - subpath: "resources/application.yaml"
        content: |
          spring:
          liquibase:
            enabled: false
          sql:
            init:
              mode: never
          autoconfigure:
            exclude:
              - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration'

      - subpath: "kotlin/{{packagePath}}/adapters/outbound/repository/stub/InMemoryJdbcExampleRepositoryAdapter.kt"
        content: |
          package {{packagePath}}.adapters.outbound.repository.stub

          import {{packagePath}}.models.ModelExample
          import {{packagePath}}.ports.outbound.ExampleRepositoryPort
          import java.util.*
          import java.util.concurrent.ConcurrentHashMap

          class InMemoryJdbcExampleRepositoryAdapter : ExampleRepositoryPort{
              private val database = ConcurrentHashMap<Int, ModelExample>()

              override fun findById(id: Int): ModelExample? {
                  return database[id]
              }
              override fun save(example: ModelExample) {
                  database[example.id] = example
              }
              fun clear(){
                  database.clear()
              }
          }