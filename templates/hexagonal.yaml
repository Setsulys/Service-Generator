  - path: "infrastructure/src/main/kotlin/{{packagePath}}/"
    files:
      - subpath: "{{projectPascalCase}}Application.kt"
        content: |
          package {{packagePath}}
  
          import org.springframework.boot.autoconfigure.SpringBootApplication
          import org.springframework.boot.runApplication
          
          @SpringBootApplication
          class {{projectPascalCase}}Application
        
          fun main(args: Array<String>) {
            runApplication<{{projectPascalCase}}Application>(*args)
          }

      - subpath: "adapters/inbound/rest/ExampleApiAdapter.kt"
        content: |
          package {{packagePath}}.adapters.inbound.rest
          
          import org.springframework.web.bind.annotation.RestController
          import org.springframework.web.bind.annotation.PostMapping
          
          @RestController
          class ExampleApiAdapter(
          
          ){
            @PostMapping("/example/endpoint")
            fun `example method`(example: Int){
            }
          }

      - subpath: "adapters/inbound/rest/dto/ExampleDTO.kt"
        content: |
          package {{packagePath}}.adapters.inbound.rest.dto
          import {{packagePath}}.models.ModelExample
          data class ExampleDTO(val example: Int)

          fun ExampleDTO.toModelExample(): ModelExample {
              return ModelExample(id=this.example)
          }

      - subpath: "adapters/outbound/repository/ExampleJdbcAdapter.kt"
        content: |
          package {{packagePath}}.adapters.outbound.repository
          
          import {{packagePath}}.ports.outbound.ExampleRepositoryPort
          import {{packagePath}}.models.ModelExample
  
          import org.springframework.jdbc.core.simple.JdbcClient
          import org.springframework.stereotype.Component

          @Component
          class ExampleJdbcAdapter(
              val jdbcClient: JdbcClient
          ): ExampleRepositoryPort {

              override fun findById(id: Int): ModelExample? {
                  val sql = """
                       SELECT * 
                       FROM example
                       WHERE id = :id
                  """.trimIndent()

                  return jdbcClient.sql(sql)
                      .param("id", id)
                      .query{ rs, _ ->
                          ModelExample(
                              id = rs.getInt("id")
                          )
                      }
                      .optional()
                      .orElse(null)
              }

              override fun save(example: ModelExample) {
                 val sql = """
                      INSERT INTO example (id) 
                      VALUES (:id)
                 """.trimIndent()
                  jdbcClient.sql(sql)
                      .param("id", example.id.toString())
                      .update()
              }
          }
      - subpath: "config/DomainConfiguration.kt"
        content: |
          package {{packagePath}}.config
          
          import {{packagePath}}.ports.inbound.ExampleUseCase
          import {{packagePath}}.ports.outbound.ExampleRepositoryPort
          import {{packagePath}}.services.ExampleUseCaseImpl
          
          import org.springframework.context.annotation.Bean
          import org.springframework.context.annotation.Configuration
          
          @Configuration
          class DomainConfiguration{    
            @Bean
            fun exampleUseCase(exampleRepositoryPort: ExampleRepositoryPort): ExampleUseCase {
              return ExampleUseCaseImpl(exampleRepositoryPort)
            }
          }
